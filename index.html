<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Antonella is turning 3</title>
  <meta name="description" content="You're invited to Antonella's 3rd birthday party.">
  <meta name="theme-color" content="#fffdfb">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shared paper sheen used by every butterfly's wings -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="paperSheen" x1="0" y1="0" x2="1" y2="0.4">
        <stop offset="0" stop-color="#000" stop-opacity="0.07"/>
        <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0.55"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="paper" aria-hidden="true"></div>
  <div id="vines" aria-hidden="true"></div>
  <div id="butterflies" aria-hidden="true"></div>

  <div class="lang-toggle" role="group" aria-label="Language / Idioma">
    <button type="button" data-lang="en">EN</button>
    <span aria-hidden="true">·</span>
    <button type="button" data-lang="es">ES</button>
  </div>

  <main class="page">
    <header class="hero">
      <p class="kicker" data-i18n="kicker"></p>
      <h1 class="name"><span data-party="firstName"></span></h1>
      <p class="surname" data-party="lastNames"></p>
      <p class="turning"><span data-i18n="turning"></span></p>
      <p class="age" data-party="age"></p>
      <div class="flourish" aria-hidden="true">
        <svg viewBox="0 0 160 16"><path d="M2 8 C 30 8, 40 2, 60 8 S 76 14, 80 8 S 92 2, 100 8 S 130 8, 158 8" /><circle cx="80" cy="8" r="2"/></svg>
      </div>
    </header>

    <section class="block">
      <h2 data-i18n="when"></h2>
      <p class="big" id="date-text"></p>
      <p id="time-text"></p>
    </section>

    <section class="block">
      <h2 data-i18n="where"></h2>
      <p class="big" data-party="venue"></p>
      <p data-party="address"></p>
      <a class="ink-link" id="maps-link" target="_blank" rel="noopener">
        <span data-i18n="maps"></span> <span aria-hidden="true">→</span>
      </a>
    </section>

    <div class="flourish small" aria-hidden="true"><svg viewBox="0 0 72 12"><path d="M2 6 H28 M44 6 H70"/><path d="M36 1 L41 6 L36 11 L31 6 Z"/></svg></div>

    <section class="block" id="rsvp">
      <h2 data-i18n="rsvpTitle"></h2>
      <p class="intro" data-i18n="rsvpIntro"></p>

      <form id="rsvp-form" novalidate>
        <fieldset class="choice">
          <legend data-i18n="attendingQ"></legend>
          <label class="pill"><input type="radio" name="attending" value="yes" required><span data-i18n="yes"></span></label>
          <label class="pill"><input type="radio" name="attending" value="no"><span data-i18n="no"></span></label>
        </fieldset>

        <div class="field">
          <label for="adultName" data-i18n="adultName"></label>
          <input id="adultName" name="adultName" type="text" autocomplete="name" maxlength="80" required>
        </div>

        <div class="field">
          <label for="phone" data-i18n="phone"></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30">
        </div>

        <div id="attending-fields" hidden>
          <div class="counts">
            <div class="stepper" data-name="adults" data-min="1" data-max="10" data-value="1">
              <span class="stepper-label" data-i18n="adults"></span>
              <div class="stepper-ctrl">
                <button type="button" data-step="-1" aria-label="−">−</button>
                <output></output>
                <button type="button" data-step="1" aria-label="+">+</button>
              </div>
            </div>
            <div class="stepper" data-name="children" data-min="0" data-max="8" data-value="1">
              <span class="stepper-label" data-i18n="children"></span>
              <div class="stepper-ctrl">
                <button type="button" data-step="-1" aria-label="−">−</button>
                <output></output>
                <button type="button" data-step="1" aria-label="+">+</button>
              </div>
            </div>
          </div>

          <p class="hint" id="children-hint" data-i18n="childrenHint"></p>
          <div id="children-list"></div>
        </div>

        <!-- Honeypot: left empty by people, filled by bots -->
        <div class="hp" aria-hidden="true">
          <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
        </div>

        <p class="form-msg" id="form-msg" role="alert"></p>
        <button class="ink-button" type="submit" id="submit-btn"><span data-i18n="submit"></span></button>
      </form>

      <div id="rsvp-done" class="done" hidden>
        <p class="big" id="done-text"></p>
        <button type="button" class="ink-link as-button" id="rsvp-again" data-i18n="another"></button>
      </div>
    </section>

    <div class="flourish small" aria-hidden="true"><svg viewBox="0 0 72 12"><path d="M2 6 H28 M44 6 H70"/><path d="M36 1 L41 6 L36 11 L31 6 Z"/></svg></div>

    <section class="block">
      <h2 data-i18n="giftsTitle"></h2>
      <p data-i18n="giftsText"></p>
      <a class="ink-button" id="registry-link" target="_blank" rel="noopener" hidden><span data-i18n="giftsBtn"></span></a>
      <p class="soon" id="registry-soon" data-i18n="giftsSoon" hidden></p>
    </section>

    <section class="block">
      <h2 data-i18n="questionsTitle"></h2>
      <p><span data-i18n="questionsText"></span> <strong data-party="contactName"></strong></p>
      <p><a class="ink-link" id="phone-link"><span data-party="contactPhoneDisplay"></span></a></p>
    </section>

    <section class="block privacy">
      <h2 data-i18n="privacyTitle"></h2>
      <p data-i18n="privacyText"></p>
    </section>

    <footer class="folio">
      <p data-i18n="footer"></p>
      <p class="page-number" aria-hidden="true">— 3 —</p>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="vines.js"></script>
  <script src="butterflies.js"></script>
  <script src="app.js"></script>
</body>
</html>
